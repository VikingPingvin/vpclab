# Floci acts purely as the AWS control plane. EC2 runs in mock mode so Floci
# never creates containers or networks; vpcsim builds the data plane instead.
services:
  floci:
    image: floci/floci:2.3.0
    restart: unless-stopped # WSL stops idle distros; bring Floci back on the next start
    ports:
      - "4566:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
    environment:
      FLOCI_STORAGE_MODE: hybrid
      FLOCI_SERVICES_EC2_MOCK: "true"
      FLOCI_SERVICES_IAM_ENFORCEMENT_ENABLED: "true"
      FLOCI_SERVICES_ORGANIZATIONS_SCP_ENFORCEMENT_ENABLED: "true"
      FLOCI_SERVICES_S3_ENFORCE_AUTH: "true"

  # Optional read-only AWS-console-style UI (github.com/liammizrahi/stackdeck).
  # EC2/VPC pages only read; change resources with the AWS CLI.
  # Start: vpclab dashboard (opens http://localhost:4577); stop: vpclab dashboard stop
  dashboard:
    profiles: [dashboard]
    image: ghcr.io/liammizrahi/stackdeck:26.0.3
    restart: unless-stopped
    ports:
      - "4577:4577"
    environment:
      AWS_ENDPOINT_URL: http://floci:4566
    depends_on:
      - floci
